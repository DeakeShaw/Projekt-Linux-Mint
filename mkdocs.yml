site_name: Projekt Linux Mint
site_url: https://deakeshaw.github.io/Projekt-Linux-Mint/
site_author: Deake Shaw

repo_name: DeakeShaw/Projekt-Linux-Mint
repo_url: https://github.com/DeakeShaw/Projekt-Linux-Mint

site_url: https://mydomain.org/mysite
theme:
  name: material
  features:
    # - announce.dismiss
    # - content.action.edit
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    # - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    # - navigation.footer
    - navigation.indexes
    - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    - navigation.instant.preview
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    # - navigation.tracking
    # - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate

  palette:
    - media: '(prefers-color-scheme)'
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  
  font: false
  favicon: assets/images/logo-32x32.png
  logo: assets/images/logo-192x192.png
  icon:
    annotation: material/information-slab-circle-outline

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys

  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/checklist-save.js

# Plugins
plugins:
  - search:
      lang: de
      separator: '[\s\-]+'
  # - git-revision-date-localized:
  #     enable_creation_date: true
  #     type: timeago
  #     fallback_to_build_date: true
  # - git-committers:
  #     repository: dein-username/dein-repo-name
  #     branch: main

# Page tree
nav:
  - Willkommen: index.md

  - Programme: 
    - apps/index.md
    - Epson Scan 2: apps/epsonscan2.md
    # - KeePassXC: apps/keepassxc.md
    # - NAPS2: apps/naps2.md

  - Linux Mint:
    - mint/index.md
    # - Anwendungen: mint/apps.md
    - Legitimierung: mint/legitimierung.md
    - Schlüsselbund: mint/schluesselbund.md
    # - Nutzer: mint/user.md

  - Projekt-Dokumentation (IT):
    - project/index.md
    - Boot-Stick:
      - project/boot-stick/iso-erstellen.md
      - project/boot-stick/iso-anpassen.md
      - project/boot-stick/iso-auf-stick.md
    - Checklisten:
      - Einrichtung: project/checklists/einrichtung.md
      # - Installation: project/checklists/installation.md
